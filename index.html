<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Business Card Template</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="card">
        <!-- Top color bar - students can change the color -->
        <div class="color-bar"></div>
        
        <!-- Logo - students can add their initials or a simple icon -->
        <div class="logo">
            <img src="./download (2).jpg"alt="Profile Photo" class="logo-img">
        </div>
        
        <!-- Contact information - students can customize all text -->
        <div class="info">
            <div class="name">Josh Allen</div>
            <div class="title">NFL Star</div>
            <div class="contact">JA17@bills.com</div>
            <div class="contact">Phone: (716) 017-1973</div>
            <div class="contact">Website: www.YourMVP.com</div>
        </div>
        
        <!-- Footer - students can add a slogan or remove this -->
        <div class="footer">Building the future, one TD at a time</div>
    </div>
</body>
</html>
